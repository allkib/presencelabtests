<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pose Demo</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Pose Demo</h1>
    <nav class="modes" role="tablist" aria-label="Camera source">
      <button id="modeBrowser" role="tab" data-mode="browser">Browser camera</button>
      <button id="modeServer" role="tab" data-mode="server" hidden>Server camera</button>
    </nav>
    <div class="meta">
      <span id="status" class="pill">starting…</span>
      <span id="fps" class="pill">– FPS</span>
    </div>
  </header>
  <main>
    <section class="video">
      <div id="browserStage" class="stage">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="startPanel" class="start-panel">
          <p>Your camera is processed by the pose model on the server. Nothing is stored.</p>
          <button id="startBtn" class="primary">Start camera</button>
        </div>
        <button id="stopBtn" class="stop" hidden>Stop</button>
      </div>
      <img id="stream" alt="Annotated server camera stream" hidden />
      <div id="error" class="error" hidden></div>
    </section>
    <aside>
      <h2>People</h2>
      <ul id="people" class="people"><li class="empty">Nobody detected yet</li></ul>
      <h2>Poses I know</h2>
      <ul id="poses" class="poses"></ul>
    </aside>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
